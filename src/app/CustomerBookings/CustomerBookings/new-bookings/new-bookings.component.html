<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
    <li>
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-home />
        </a>
    </li>
    
    <li
        class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full before:bg-primary">
        <button mat-button [matMenuTriggerFor]="menu"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-cpu-bolt class="ltr:mr-2 rtl:ml-2" />
            New Bookings
            <icon-caret-down class="inline-block ltr:ml-1 rtl:mr-1" />
        </button>

        <mat-menu #menu="matMenu">

            <button mat-menu-item routerLink="/customer/awaitpickups">Pickup Arranged Shipmets</button>
            <button mat-menu-item routerLink="/customer/cancelBookings">Cancelled Bookings</button>

        </mat-menu>
    </li>

</ol>

<div>

    <!-- <button  (click)="exportToExcel()">click</button> -->
    <ejs-grid #mainGrid appInputSearch [dataSource]='filteredRowAssignList' height='90vh' [allowResizing]="false"
        [allowReordering]="true" [allowSorting]='true' [allowPdfExport]="true" [allowFiltering]='true' enablePersistence="true"
        (toolbarClick)="ToogledToolBar($event)" [filterSettings]='filterSettings'  
        (rowSelected)="orderViewAssign($event.data, '1', $event.rowIndex)" (rowDataBound)="onRowDataBound($event)"
        [toolbar]="toolbarOptions" toolbarOverflowMode="Scrollable" [allowPaging]='true' 
        [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }' [editSettings]="editSettings"
        (actionBegin)="onActionBegin($event)"   [textWrapSettings]="{wrapMode:'all'}" [allowTextWrap]='true'>
        <e-columns>
            <!-- Serial Number -->
           

            <!-- HAWB NO.. -->
            <e-column field='invoice_no' headerText='HAWB NO.' width='150' [allowSorting]='true' [allowFiltering]='true'
                filterType='Input' [template]="templateNav">
              <ng-template #templateNav let-data>
            <span class="cursor-pointer text-blue-500" (click)="navigateShipment(data)">{{data.invoice_no}}</span>
          </ng-template></e-column>
                <e-column field='reason_for_non_pickup' headerText='Label' width='200' [allowSorting]='true'
          [allowFiltering]='true' filterType='Input' [template]="resaonForDelay">
  <ng-template #resaonForDelay let-data>
    <span *ngIf="data.reason_for_non_pickup" class="badge bg-secondary"
          style="font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
      {{data.reason_for_non_pickup}}
    </span>
  </ng-template>
</e-column>

   <e-column field='employee_name' headerText='Sales Rep' width='150' [allowSorting]='true' [allowFiltering]='true'
          filterType='Input'></e-column>

            <!-- HAWB Date -->
            <e-column field='created_date' headerText='HAWB Date' width='150' format='dd/MM/yyyy'
                [allowFiltering]='true' filterType='Date'></e-column>

            <!-- Sender Name -->
            <e-column field='sender_name' headerText='Sender Name' width='180' [allowFiltering]='true'></e-column>

            <!-- Total Pkgs -->
            <e-column field='total_carton' headerText='Total Pkgs.' width='100' textAlign='Right'
                [allowFiltering]='true' filterType='Number'></e-column>

            <!-- Total Weight -->
            <e-column field='total_weight' headerText='Total Weight' width='100' textAlign='Right'
                [allowFiltering]='true' filterType='Number'></e-column>

            <!-- Collection Type -->
            <e-column field='collection_type' headerText='Collection Type' width='180'
                [allowFiltering]='true'></e-column>
            <e-column headerText='Collection Type' width='180' [allowFiltering]='true'>

                <ng-template #template let-data>
                    <div class="flex items-center gap-2">
                        <span [ngClass]="data.contact_status === 'N' ? 'text-red-500' : 'text-green-500'"
                            [ngxTippy]="data.contact_status === 'N' ? 'Call not placed' : 'Call placed'">
                            <icon-phone-call class="h-5 w-5"></icon-phone-call>
                        </span>


                        <span [ngClass]="data.verified_details != '1' ? 'text-red-500' : 'text-green-500'"
                            [ngxTippy]="data.verified_details != '1' ? 'Customer Details Not Verified' : 'Customer Details Verified'">
                            <icon-square-check class="h-5 w-5 "></icon-square-check>
                        </span>

                    </div>
                </ng-template>


            </e-column>
