<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
    <li>
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-home />
        </a>
    </li>

    <li
        class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full before:bg-primary">
        <button mat-button [matMenuTriggerFor]="menu"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-cpu-bolt class="ltr:mr-2 rtl:ml-2" />
            Pickup Arranged Shipmets
            <icon-caret-down class="inline-block ltr:ml-1 rtl:mr-1" />
        </button>

        <mat-menu #menu="matMenu">
            <button mat-menu-item routerLink="/customer/newBookings"> New Bookings</button>
            <button mat-menu-item routerLink="/customer/cancelBookings">Cancelled Bookings</button>

        </mat-menu>
    </li>

</ol>


<ejs-grid #grid1 appInputSearch class="custom-table " [dataSource]="pickupShipemnts" [allowSorting]="true"
    allowFiltering="true" [allowResizing]="false" [allowReordering]="true" [allowSorting]='true'
    [allowExcelExport]="true" [allowPdfExport]="true" [allowFiltering]='true' [filterSettings]='filterSettings'
    (rowSelected)="orderViewAssign($event.data, '1', $event.rowIndex)" (rowDataBound)="onRowDataBound($event)"
    [toolbar]="toolbarOptions" toolbarOverflowMode="Scrollable" [allowPaging]='true'
    [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }' [editSettings]="editSettings"
    [textWrapSettings]="{wrapMode:'all'}" [allowTextWrap]='true'>
    <e-columns>
        <e-column [allowSorting]='true' [allowFiltering]='true' filterType='Input' field="invoice_no"
            headerText="HAWB NO.." width="120" textAlign="Center" isPrimaryKey="true" [template]="templateNav">
            <ng-template #templateNav let-data>
                <span class="cursor-pointer text-blue-500" (click)="navigateShipment(data)">{{data.invoice_no}}</span>
            </ng-template></e-column>
        <e-column [allowSorting]='true' [allowFiltering]='true' filterType='Input' field="collection_type"
            headerText="Collection Date" width="120" textAlign="Center" isPrimaryKey="true"></e-column>
        <e-column field="co_loader_tracking_no" headerText="Co Loader Ref" width="120" textAlign="Center"
            isPrimaryKey="true">
            <ng-template #template let-data>
                <div style="white-space: normal; word-wrap: break-word; word-break: break-word;">
                    {{ data.co_loader_tracking_no }}
                </div>
            </ng-template>
        </e-column>

        <e-column field="transporter_name" headerText="3rd Party Name" width="120" textAlign="Center"
            isPrimaryKey="true"></e-column>
        <!-- <e-column field="origin_country" headerText="Origin Country" width="150" textAlign="Center"></e-column>
                      <e-column field="delivery_Location" headerText="Delivery Location" width="150" textAlign="Center"
                        defaultValue="IN"></e-column> -->
        <e-column field="total_carton" headerText="Total Carton" width="120" textAlign="Center"
            type="number"></e-column>
        <e-column field="total_weight" headerText="Total Weight" width="120" textAlign="Center"
            type="number"></e-column>

        <e-column field="api_status" width="120" textAlign="Center" [headerTemplate]="statusHeader"
            [template]="stsDesign">
            <ng-template #statusHeader>
                <div style="display: flex; justify-content: center; align-items: center; gap: 5px;">
                    <span>Updated Status <i style="cursor: pointer;" class="fas fa-redo-alt"
                            (click)="UpdateSts()"></i></span>
                </div>
            </ng-template>

            <ng-template #stsDesign let-data>
                <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                    [ngxTippy]="data.api_status">
                    {{ data.api_status ? data.api_status : '' }}
                </div>
            </ng-template>
        </e-column>


        <e-column field="collection_status_new" headerText="Status" width="120" textAlign="Center">
            <ng-template #template let-data>
                <div class="flex items-center gap-2">
                    <!-- Call Status Icon -->
                    <span [ngClass]="data.call_status_new === 'Called' ? 'text-green-500' : 'text-red-500'"
                        [ngxTippy]="data.call_status_new === 'Called' ? 'Call placed' : 'Call not placed'">
                        <icon-phone-call class="h-5 w-5"></icon-phone-call>
                    </span>

                    <!-- Collection Status Icon -->
                    <span [ngClass]="
    data.collection_status_new === 'Collected' 
      ? 'text-green-500' 
      : data.collection_status_new === 'Nothing To Collect' 
        ? 'text-gray-500' 
        : 'text-red-500'
  " [ngxTippy]="
    data.collection_status_new === 'Collected' 
      ? 'Collected' 
      : data.collection_status_new === 'Nothing To Collect' 
        ? 'Nothing To Collect' 
        : 'Not Collected'
  ">
                        <icon-square-check class="h-5 w-5" />
                    </span>

                    <span [ngClass]="data.conformation_img === 'Received' ? 'text-green-500' : 'text-red-500'"
                        [ngxTippy]="data.conformation_img === 'Received' ? 'Image Collected' : 'Image Not Collected'">
                        <icon-camera class="h-5 w-5" />
                    </span>
                    <span
                        [ngClass]="data.mail_status === 'Mail Sended' ? 'text-green-500' : data.mail_status === 'Mail Sended With Label' ? 'text-blue-500' : 'text-red-500'"
                        [ngxTippy]="data.mail_status === 'Mail Sended' ? 'Mail Sended' : data.mail_status === 'Mail Sended With Label'  ? 'Mail Sended With Label' : 'Mail Not Sended'">
                        <icon-at class="h-5 w-5" />
                    </span>
                    <span [ngClass]="getIconClass(data.depositInvoiceAction)" class="flex justify-center items-center">
                        <ng-container *ngIf="data.depositInvoiceAction === 'Not Generated'">
                            <span [ngxTippy]="'Not Generated'">
                                <icon-x class="h-6 w-6" />
                            </span>
                        </ng-container>
                        <ng-container *ngIf="data.depositInvoiceAction === 'Generated'">
                            <span [ngxTippy]="'Invoice Generated'">
                                <icon-file class="h-6 w-6" />
                            </span>
                        </ng-container>
                        <ng-container *ngIf="data.depositInvoiceAction === 'Marked as Sent'">
                            <span [ngxTippy]="'Marked as Sent'">
                                <icon-checks class="h-6 w-6" />
                            </span>
                        </ng-container>
                        <ng-container *ngIf="data.depositInvoiceAction === 'Sent to Customer'">
                            <span [ngxTippy]="'Sent to Customer'">
                                <icon-mail class="h-6 w-6" />
                            </span>
                        </ng-container>
                    </span>

                </div>
            </ng-template>
        </e-column>



        <!-- <e-column field="country_name" headerText="Country Name" width="150" textAlign="Center"></e-column> -->
        <e-column headerText='Actions' width='100' textAlign='Center'>
            <ng-template #template let-data>
                <button mat-icon-button [matMenuTriggerFor]="actionMenu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 512 512">
                        <path
                            d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8 2.8 18.6 .3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z" />
                    </svg>
                </button>

                <mat-menu #actionMenu="matMenu">
                    <button *ngIf="data.call_status == 1 || data.call_status == 2" mat-menu-item
                        (click)="verifyColoaderPickup(data, '0', 'call')">
                        <!-- <i class="fas fa-phone text-success me-2"></i> -->
                        <span>Mark as Not Called</span>
                    </button>
                    <button *ngIf="data.call_status != 1" mat-menu-item
                        (click)="verifyColoaderPickup(data, '1', 'call')">
                        <!-- <i class="fas fa-phone-slash text-danger me-2"></i> -->
                        <span>Mark as Called</span>
                    </button>

                    <button *ngIf="data.conformation_img != 'Received'" mat-menu-item
                        (click)="verifyColoaderPickup(data, '1', 'con_img')">
                        <!-- <i class="fas fa-check-circle me-2 "></i> -->
                        <span> Collected Img</span>
                    </button>
                    <button *ngIf="data.conformation_img == 'Received'" mat-menu-item
                        (click)="verifyColoaderPickup(data, '0', 'con_img')">
                        <!-- <i class="fas fa-check-circle me-2 "></i> -->
                        <span>Not Collected Img</span>
                    </button>

                    <button *ngIf="data.collection_status == 1 || data.collection_status == 2" mat-menu-item
                        (click)="verifyColoaderPickup(data, '0', 'pickup')">
                        <!-- <i class="fas fa-redo-alt me-2"></i> -->
                        <span>Reset Pickup</span>
                    </button>

                    <!-- Show Mark as Collected if not already marked as Collected -->
                    <button *ngIf="data.collection_status != 1" mat-menu-item
                        (click)="verifyColoaderPickup(data, '1', 'pickup')">
                        <!-- <i class="fas fa-check-circle me-2"></i> -->
                        <span>Mark as Collected</span>
                    </button>

                    <!-- Show Nothing to Collect if not already marked as such -->
                    <button *ngIf="data.collection_status != 2" mat-menu-item
                        (click)="verifyColoaderPickup(data, '2', 'pickup')">
                        <span>Nothing To Collect</span>
                    </button>


                </mat-menu>
            </ng-template>

        </e-column>




    </e-columns>

    <e-aggregates>
        <e-aggregate>
          <e-columns>
           
            <e-column field="total_carton" type="Sum">
              <ng-template #footerTemplate let-data>
                Total Carton: {{ convertNumber(data.Sum) | number:'1.0-0' }}
              </ng-template>
            </e-column>
            <e-column field="total_weight" type="Sum">
              <ng-template #footerTemplate let-data>
                Total Weight: {{ convertNumber(data.Sum) | number:'1.0-0' }}
              </ng-template>
            </e-column>
          </e-columns>
        </e-aggregate>
      </e-aggregates>
</ejs-grid>

<!-- Show empty state when no data -->
