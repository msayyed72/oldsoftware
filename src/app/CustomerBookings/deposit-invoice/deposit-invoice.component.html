<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
  <li>
    <a href="javascript:;"
      class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
      <icon-home />
    </a>
  </li>
  <li
    class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full ">
    <a href="javascript:;"
      class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
      <icon-users-group class="shrink-0 ltr:mr-2 rtl:ml-2" />

     Deposit Invoice
    </a>
  </li>

  

</ol>


<div class="panel">

  <div class="mb-5">
    <div class="mt-3 flex flex-wrap gap-2">
      <a href="javascript:;"
        class="-mb-[1px] flex items-center rounded p-3.5 py-2 !outline-none transition duration-300 hover:bg-secondary hover:text-white"
        [ngClass]="{ 'bg-secondary text-white': tab4.toLowerCase()  === 'home' }" (click)="tab4 = 'home'">
        <icon-home class="ltr:mr-2 rtl:ml-2" />
        Before Arranging Collection
      </a>

      <a href="javascript:;"
        class="-mb-[1px] flex items-center rounded p-3.5 py-2 !outline-none transition duration-300 hover:bg-secondary hover:text-white"
        [ngClass]="{ 'bg-secondary text-white': tab4.toLowerCase()  === 'profile' }" (click)="tab4 = 'profile';get_Pickup_allocatedListByCoLoader('1','4')">
        <icon-user class="h-5 w-5 ltr:mr-2 rtl:ml-2" />
        After Arranging Collection
      </a>



    </div>
    <div class="flex-1 pt-5 text-sm">
      <div *ngIf="tab4.toLowerCase() === 'home'">
        <ejs-grid #mainGrid appInputSearch [dataSource]='filteredRowAssignList' height='90vh' [allowResizing]="false"
          [allowReordering]="true" [allowSorting]='true' [allowPdfExport]="true" [allowFiltering]='true'
          [filterSettings]='filterSettings' [toolbar]="toolbarOptions" toolbarOverflowMode="Scrollable"
          [allowPaging]='true' [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }'
          [editSettings]="editSettings" (actionBegin)="onActionBegin($event)"   [textWrapSettings]="{wrapMode:'all'}" [allowTextWrap]='true'  >
          <e-columns>
            <!-- Serial Number -->
            <!-- <e-column headerText='SR NO.' width='80' textAlign='Center' [template]="serialTemplate"></e-column> -->

            <!-- HAWB NO.. -->
            <e-column field='invoice_no' headerText='HAWB NO.' width='100' [allowSorting]='true' [allowFiltering]='true'
              [template]="templateNav" filterType='Input'>

              <ng-template #templateNav let-data>
                <span class="cursor-pointer text-blue-500" (click)="navigateShipment(data)">{{data.invoice_no}}</span>
              </ng-template>
            </e-column>

            <!-- HAWB Date -->
            <e-column field='created_date' headerText='HAWB Date' width='120' format='dd/MM/yyyy'
              [allowFiltering]='true' filterType='Date'></e-column>

            <!-- Sender Name -->
            <e-column field='sender_name' headerText='Sender Name' width='180' [allowFiltering]='true'></e-column>

            <!-- Email -->
            <e-column field='shipper_mail_id' headerText='Email' width='180' textAlign='Left'
              [allowFiltering]='true'></e-column>

            <!-- Paid Amt -->
            <e-column field='deposit_payment_amt' headerText='Paid Amt' width='100' textAlign='Right'
              [allowFiltering]='true' filterType='  Number'></e-column>

            <!-- Invoice Status -->
            <e-column field="depositInvoiceAction" headerText="Invoice Status" width='150' textAlign="Center">
              <ng-template #template let-data>
                <span [ngClass]="getIconClass(data.depositInvoiceAction)" class="flex justify-center items-center">
                  <ng-container *ngIf="data.depositInvoiceAction === 'Not Generated'">
                    <span [ngxTippy]="'Not Generated'">
                      <icon-x class="h-6 w-6" />
                    </span>
                  </ng-container>
                  <ng-container *ngIf="data.depositInvoiceAction === 'Generated'">
                    <span [ngxTippy]="'Invoice Generated'">
                      <icon-file class="h-6 w-6" />
                    </span>
                  </ng-container>
                  <ng-container *ngIf="data.depositInvoiceAction === 'Marked as Sent'">
                    <span [ngxTippy]="'Marked as Sent'">
                      <icon-checks class="h-6 w-6" />
                    </span>
                  </ng-container>
                  <ng-container *ngIf="data.depositInvoiceAction === 'Sent to Customer'">
                    <span [ngxTippy]="'Sent to Customer'">
                      <icon-mail class="h-6 w-6" />
                    </span>
                  </ng-container>
                </span>
              </ng-template>
            </e-column>
