<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
    <li>
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-home />
        </a>
    </li>
    <li
        class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full ">
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
            <icon-users-group class="shrink-0 ltr:mr-2 rtl:ml-2" />

            Pending Stock
        </a>
    </li>



</ol>


<form class="mx-auto mb-5 w-full sm:w-1/2">
    <div class="relative">
        <input type="text" placeholder="Search Hawb..."
            class="form-input h-11 rounded-full bg-white shadow-[0_0_4px_2px_rgb(31_45_61_/_10%)] placeholder:tracking-wider ltr:pr-11 rtl:pl-11"
            [(ngModel)]="invoiceFilter" maxlength="6" (input)="v1_sp_ds_hawb_final_invoice_image_get()" name="search" />
        <button type="button"
            class="btn btn-primary absolute inset-y-0 m-auto flex h-9 w-9 items-center justify-center rounded-full p-0 ltr:right-1 rtl:left-1">
            <icon-search class="mx-auto" (click)="v1_sp_ds_hawb_final_invoice_image_get()" />
        </button>
    </div>
</form>

<div *ngIf="receivedDate.length > 0" class="container-fluid mt-4 w-full ">
    <h4 class="text-xl font-semibold mb-4">HAWB Status Overview</h4>
    <div class="flex flex-wrap">
        <div class="w-full lg:w-1/3 p-2" *ngFor="let item of receivedDate">
            <div class="bg-white shadow-lg rounded-lg p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-semibold text-lg">{{ item.hawb_no_box }}</span>
                    <ng-container [ngSwitch]="item.status">
                        <span *ngSwitchCase="'0'" class="badge bg-secondary py-1 px-3 text-white">Status Not Available</span>
                        <span *ngSwitchCase="'1'" class="badge bg-warning text-dark py-1 px-3">Unpacked</span>
                        <span *ngSwitchCase="'2'" class="badge bg-success py-1 px-3">Packed</span>
                        <span *ngSwitchDefault class="badge bg-light py-1 px-3">Unknown</span>
                    </ng-container>
                </div>
                <div class="flex space-x-2">
                    <ng-container [ngSwitch]="item.status">
                        <ng-container *ngSwitchCase="'0'">
                            <button class="btn btn-sm btn-outline-primary" (click)="changePackingStatus(item, '1')">Change to Unpacked</button>
                            <button class="btn btn-sm btn-outline-success" (click)="changePackingStatus(item, '2')">Change to Packed</button>
                        </ng-container>
                        <ng-container *ngSwitchCase="'1'">
                            <button class="btn btn-sm btn-outline-success" (click)="changePackingStatus(item, '2')">Change to Packed</button>
                        </ng-container>
                        <ng-container *ngSwitchCase="'2'">
                            <button class="btn btn-sm btn-outline-warning" (click)="changePackingStatus(item, '1')">Change to Unpacked</button>
                        </ng-container>
                    </ng-container>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Second Table Section -->
<div class="container-fluid">
  <div class="row">
    <ejs-grid appInputSearch [filterSettings]='filterSettings' [allowSorting]='true'
      [allowExcelExport]="true" [toolbar]="toolbarOptions"  [allowFiltering]='true' [dataSource]="packedAndUnpackedDate" [allowPaging]="true" [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }'>
      <e-columns>
        <e-column headerText="SI No." width="120" [template]="serialTemplate"></e-column>
        <e-column field="invoice_no" headerText="Invoice No" width="120"></e-column>
        <e-column field="box_no" headerText="Bag No." width="120"></e-column>
        <e-column field="sales_rep" headerText="Sales Rep" width="150"></e-column>

        <!-- Custom Payment Status Column -->
        <e-column field="payment_status" headerText="Payment Status" width="130" [template]="paymentStatusTemplate"></e-column>

        <!-- Custom Packed/Unpacked Status Column -->
        <e-column field="packed_unpacked_status" headerText="Packed/Unpacked" width="150" [template]="packStatusTemplate"></e-column>

        <e-column field="packed_unpacked_status_updated_time" headerText="Updated Time" width="160" format="yMd"></e-column>
        <e-column  headerText="Action" width="160" [template]="deleteInvoice"></e-column>
      </e-columns>

      <!-- Serial Template -->
      <ng-template #serialTemplate let-data let-rowIndex="rowIndex">
        {{ +data.index + 1 }}
      </ng-template>  
      <ng-template #deleteInvoice let-data>
        <span (click)="deleteCartonDetail(data)">
    <i class="fa fa-trash text-danger ml-2" style="cursor: pointer; font-size: 20px;"
                    ></i>
        </span>
     
      </ng-template>

      <!-- Payment Status Template -->
      <ng-template #paymentStatusTemplate let-data>
        <span >
          {{ data.payment_status === 'yes' ? 'Paid' : 'Not Paid' }}
        </span>
      </ng-template>

      <!-- Packed/Unpacked Status Template -->
      <ng-template #packStatusTemplate let-data>
        <span >
          {{ data.packed_unpacked_status === '1' ? 'Unpacked' : 'Packed' }}
        </span>
      </ng-template>

    </ejs-grid>
  </div>
</div>
