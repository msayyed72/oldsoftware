<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
    <li>
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-home />
        </a>
    </li>
    <li
        class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full ">
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
            <icon-users-group class="shrink-0 ltr:mr-2 rtl:ml-2" />

          Incomplete Bookings
        </a>
    </li>



</ol>


<ejs-grid #mainGrid appInputSearch [dataSource]='filteredRowAssignList' height='90vh' [allowResizing]="false"
  [allowReordering]="true" [allowSorting]='true' [allowExcelExport]="true" [allowPdfExport]="true"
  [allowFiltering]='true' (toolbarClick)="ToogledToolBar($event)" [filterSettings]='filterSettings'
  [toolbar]="toolbarOptions" toolbarOverflowMode="Scrollable" [allowPaging]='true'
  [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }'>
  <e-columns>
    <!-- Serial Number -->
    <e-column headerText='SR NO.' width='80' textAlign='Center' [template]="serialTemplate">

      <ng-template #serialTemplate let-data>
        {{+data.index +1}}
      </ng-template>
    </e-column>

    <!-- HAWB NO.. -->
    <!-- Sender Details -->

    <e-column field='customer_name' headerText='Login User' width='200' [allowFiltering]='true'></e-column>
    <e-column field='customer_mobile_no' headerText='Login User Contact' width='200' [allowFiltering]='true'></e-column>
    <e-column field='customer_emailId' headerText='Login User Email' width='200' [allowFiltering]='true'></e-column>
    <e-column field='second_name' headerText='Sender Name' width='200' [allowFiltering]='true'></e-column>

    <e-column field='sender_company' headerText='Sender Company' width='200' [allowFiltering]='true'></e-column>
    <e-column field='sender_city' headerText='Sender City' width='150' [allowFiltering]='true'></e-column>
    <e-column field='sender_pincode' headerText='Sender Pincode' width='120' [allowFiltering]='true'></e-column>
    <e-column field='sender_mobile' headerText='Sender Mobile' width='150' [allowFiltering]='true'></e-column>

    <!-- Receiver Details -->
    <e-column field='receiver_name' headerText='Receiver Name' width='180' [allowFiltering]='true'></e-column>
    <e-column field='receiver_address' headerText='Receiver Address' width='250' [allowFiltering]='true'></e-column>
    <e-column field='receiver_pincode' headerText='Receiver Pincode' width='120' [allowFiltering]='true'></e-column>
    <e-column field='receiver_state' headerText='Receiver State' width='150' [allowFiltering]='true'></e-column>
    <e-column field='receiver_district_name' headerText='Receiver District' width='150'
      [allowFiltering]='true'></e-column>
    <e-column field='receiver_mobile' headerText='Receiver Mobile' width='150' [allowFiltering]='true'></e-column>
    <e-column field="contact_status" headerText='Call Status' width='150' [allowFiltering]='true'
      [template]="callVerificationStatus"></e-column>
          <e-column field='created_date' headerText='Created Date & Time' width='200' [allowFiltering]='true'></e-column>
          <e-column field='contact_time' headerText='Contacted Time' width='200' [allowFiltering]='true'></e-column>

    <e-column headerText='Action' width='150' [allowFiltering]='true' [template]="actionForIncomplete"></e-column>
    <ng-template style="text-align: center;" #callVerificationStatus let-data>
<i class="fa fa-phone" 
   [ngClass]="data.contact_status === 'N' ? 'text-danger' : 'text-success'">
</i>
        </ng-template>
    <ng-template #actionForIncomplete let-data>
      <!-- Call Verification -->
      <button mat-icon-button [matMenuTriggerFor]="actionMenu">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 512 512">
          <path
            d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8 2.8 18.6 .3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z" />
        </svg>
      </button>
      <mat-menu #actionMenu="matMenu">

        <button mat-menu-item *ngIf="data.contact_status === 'N'" (click)="updateContact(data)">
          <span class="menu-item">
            <i class="fas fa-phone-volume me-2"></i> Call Verification
          </span>
        </button>
        <button mat-menu-item (click)="callNotesFile(data)">
          <span class="menu-item">
            <i class="fa fa-envelope me-2"></i> Add Notes
          </span>
        </button>
      </mat-menu>

    </ng-template>
    <!-- Notes -->
    <!-- <e-column headerText='Notes' width='150'>
            <ng-template #template let-data>
                <span style="cursor: pointer;" (click)="v1_sp_ds_pickup_order_call_status_get(data.invoice_no); NotesViewForInvoices.show();">
                    {{data.notes | slice:0:5}}<span *ngIf="data.notes">...</span>
                </span>
            </ng-template>
        </e-column> -->

    <!-- Assign by -->
    <!-- <e-column headerText='Assign by.' width='180'>
            <ng-template #template let-data>
                <span style="cursor: pointer;" (click)="TaskAssignmentView.show()">
                    Assigned To - {{data.task_assign_to | slice:0:4}}<span *ngIf="data.task_assign_by">...</span>
                </span>
            </ng-template>
        </e-column> -->

    <!-- Actions -->

  </e-columns>
</ejs-grid>

<ng-template #loading>
  <div class="spinner-container">
    <div class="spinner-with-text">
      <div class="spinner"></div>
      <div class="loading-text">Loading...</div>
    </div>
  </div>
</ng-template>

<modal #addNotes class="modal-top extra-large-modal" backdrop="static">
    <ng-template #modalHeader>
        <div>Add Notes</div>
    </ng-template>

    <ng-template #modalBody>
        <app-add-notes></app-add-notes>
    </ng-template>


</modal>
