<h4 class="text-gray-900 my-2" style="font-size: 14px !important;font-weight: bold;color: #656565;">Bagged Shipment Report</h4>
<div class="grid grid-cols-12 gap-4">
  <div class="col-span-12">
    <div class="panel rounded-lg shadow-sm ring-1 ring-gray-200">
      <div style="padding: 10px !important;">
        <form [formGroup]="valForm" autocomplete="off" class="space-y-4" role="form" novalidate="">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
           
            <div>
              <label class="form-label">From Date</label>
              
                <input type="date"  class="form-input"   formControlName="fromDate">
            </div>


            <div >
              <label class="form-label">To Date</label>
              
                <input type="date" class="form-input  "   formControlName="toDate">
            </div>

            
          

          </div>
        

        </form>
        <div class="mt-5 flex items-center justify-center gap-3">
          <button class="btn-success btn" type="button" (click)="getreport()" style="border-radius: 4px; padding: 5px 10px;background-color: #27C24C;">Search </button>&nbsp;&nbsp;&nbsp;
          <!-- <button class="btn btn-primary" type="button" (click)="formateUsingChatGPt()">Formate Item Details Using Chat Gpt</button>&nbsp;&nbsp;&nbsp; -->

        </div>
      </div>
    </div>
  </div>


</div>
<div class="mt-4 panel   shadow-sm ring-1 ring-gray-200" style="border-top-width: 0.5px;
    border-color: #cfdbe2;">
  <div style="padding: 10px !important;">
    

    <div class="overflow-x-auto">
      <!-- <button class="btn btn-success" type="submit" [routerLink]="['/expense-add']">Add</button> -->
    <ejs-grid appInputSearch #mainGrid class="custom-grid "
            [dataSource]="fetchCheckWeightData"
            [allowSorting]="true"
            [allowPaging]="true"
            [allowFiltering]="true"
            [allowExcelExport]="true"
           
            [toolbar]="['Search', 'ExcelExport']"
            [pageSettings]="{ pageSize: 30, pageSizes: [25,50,100,150] }"
            [filterSettings]="filterSettings"
            [enableHover]="true" 
            (actionBegin)="onActionBegin($event)"
            [allowResizing]="true"
            [allowTextWrap]="true"
            (toolbarClick)="ToogledToolBar($event)"
            [enableVirtualization]="false">


            
    
    <e-columns>
      <e-column headerText="SR NO." width="80" textAlign="Center" [template]="serialTemplate"></e-column>
      <ng-template #serialTemplate let-data   >
        {{ +data.index + 1  }}
      </ng-template>
      <e-column field="hawb_date" headerText="HAWB Date"></e-column>
      <e-column field="bag_no" headerText="Bag Name"></e-column>
      <!-- <e-column field="Hawb" headerText="HAWB No"></e-column> -->
       <e-column field="Hawb" width="120" headerText="HAWB No">
  <ng-template #template let-data>
    <a 
      [routerLink]="['/Utilities/tracking']" 
      [queryParams]="{ q: data.Hawb }" 
      target="_blank"
      style="color: #0000EE; text-decoration: none; cursor: pointer;">
      {{ data.Hawb }}
    </a>
  </ng-template>
</e-column>
      <e-column field="carton_no" headerText="Package No"></e-column>
      <e-column field="merged_hawb" headerText="Reference No"></e-column>
