<div class="mt-4 bg-white   shadow-sm ring-1 ring-gray-200" style="border-top-width: 0.5px;
    border-color: #cfdbe2;">
  <div style="padding: 10px !important;">
    

    <div  class="overflow-x-auto">
      <!-- <button class="btn btn-success" type="submit" [routerLink]="['/expense-add']">Add</button> -->
 <ejs-grid #mainGrid class="custom-grid"
          [dataSource]="fetchCheckWeightData"
          [allowSorting]="true"
          [allowPaging]="true"
          [allowFiltering]="true"
          [allowExcelExport]="true"
          [toolbar]="['Search']"
          [pageSettings]="{ pageSize: 30, pageSizes: [25,50,100,150] }"
          [filterSettings]="filterSettings"
          [enableHover]="true"
          (rowDataBound)="onRowDataBound($event)"
          [allowResizing]="true"
          [allowTextWrap]="true"
          (toolbarClick)="ToogledToolBar($event)"
          [enableVirtualization]="false">

  <e-columns>
    <e-column headerText="SR NO." width="80" textAlign="Center" [template]="serialTemplate"></e-column>
    <ng-template #serialTemplate let-data>
      {{ +data.index + 1 }}
    </ng-template>

    <e-column field="ptp_mf_no" headerText="Manifest No"></e-column>
    <e-column field="mawb" headerText="MAWB No."></e-column>
    <e-column field="manifest_date" headerText="Manifest Date"></e-column>
    <!-- <e-column field="hawb_no" headerText="HAWB No"></e-column> -->
    <e-column field="hawb_no" width="120" headerText="HAWB No">
  <ng-template #template let-data>
    <a 
      [routerLink]="['/Utilities/tracking']" 
      [queryParams]="{ q: data.hawb_no }" 
      target="_blank"
      style="color: #0000EE; text-decoration: none; cursor: pointer;">
      {{ data.hawb_no }}
    </a>
  </ng-template>
</e-column>
    <e-column field="HAWB" headerText="Bagged Hawb"></e-column>
    <e-column field="PCS" headerText="PCS"></e-column>
    <e-column field="ACTUAL WEGIHT" headerText="Actual Weight (kg)"></e-column>
    <e-column field="final_weight" headerText="Final Weight (kg)"></e-column>
    <e-column field="Content" headerText="Contents" width="300"></e-column>
    <e-column field="Sender Name" headerText="Sender Name"></e-column>
    <e-column field="Sender's Address" headerText="Sender Address" width="300"></e-column>
    <e-column field="Contact No:" headerText="Sender Contact"></e-column>
    <e-column field="Receiver's name" headerText="Receiver Name"></e-column>
    <e-column field="Receiver's Address" headerText="Receiver Address" width="300"></e-column>
    <e-column field="Receiver's Contact Number" headerText="Receiver Contact"></e-column>
    <e-column field="Receiver's ID No" headerText="Aadhaar No."></e-column>
   <e-column field="aadhar_front_url" headerText="Front URL" [template]="frontUrlTemplate"></e-column>
<e-column field="aashar_back_url" headerText="Back URL" [template]="backUrlTemplate"></e-column>

<ng-template #frontUrlTemplate let-data>
  <a [href]="data.aadhar_front_url" target="_blank">View Front</a>
</ng-template>

<ng-template #backUrlTemplate let-data>
  <a [href]="data.aashar_back_url" target="_blank">View Back</a>
</ng-template>

    <e-column field="Delivery Address NOT As Per Aadhaar" headerText="Alternate Delivery Address" width="300"></e-column>
    <e-column field="flight_date" headerText="Flight Date"></e-column>
