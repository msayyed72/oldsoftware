<h4 class="text-gray-900 my-2" style="font-size: 14px !important;font-weight: bold;color: #656565;">PackingList Report</h4>
<div class="flex flex-wrap">
  <div class="w-full sm:w-8/12 mx-5">
    <div class="bg-white shadow-md rounded-lg">
      <div style="padding: 10px !important; ">
        <form [formGroup]="valForm" autocomplete="off"  class="space-y-4" role="form" novalidate="">
          <div class="flex space-x-4 ">
           
            <div class="w-full sm:w-1/3">
              <label class="text-sm font-medium text-gray-700">From Date</label>
              <!-- <input #F_TRA  [typeahead]="transit" [typeaheadScrollable]=false class="custom-select custom-select-sm"
                type="text" placeholder="Select" [typeaheadMinLength]="0" formControlName="transit_type_name"
                (keyup.enter)="keytab($event)"   [typeaheadOptionField]="'transit_type_name'" 
                (typeaheadOnSelect)="transit_id (valForm.value)"/> -->
                <input type="date"  class="block w-full rounded-md border border-gray-300 bg-white px-3 py-1 text-xs text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"   formControlName="fromDate">
            </div>


            <div class="w-full sm:w-1/3">
              <label class="text-sm font-medium text-gray-700">To Date</label>
              <!-- <input #F_TRA  [typeahead]="transit" [typeaheadScrollable]=false class="custom-select custom-select-sm"
                type="text" placeholder="Select" [typeaheadMinLength]="0" formControlName="transit_type_name"
                (keyup.enter)="keytab($event)"   [typeaheadOptionField]="'transit_type_name'" 
                (typeaheadOnSelect)="transit_id (valForm.value)"/> -->
                <input type="date" class="block w-full rounded-md border border-gray-300 bg-white px-3 py-1 text-xs text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"   formControlName="toDate">
            </div>
          

          </div>
        

        </form>
        <div class="flex justify-center space-x-4 mt-4">
          <button class="btn btn-success btn-sm" (click)="getreport()">Search </button>&nbsp;&nbsp;&nbsp;
          <button class="btn btn-primary btn-sm"  type="button" (click)="formateUsingChatGPt()">Formate Item Details Using Chat Gpt</button>&nbsp;&nbsp;&nbsp;
          <button *ngIf="this.mainGrid.getSelectedRecords().length > 0" class="btn btn-primary btn-sm"  type="button" (click)="ReformateUsingChatGPt()">Re-Formate</button>&nbsp;&nbsp;&nbsp;

        </div>
      </div>
    </div>
  </div>
  <div class="mx-4"></div>
 <div class="w-full sm:w-3/12 mt-4 sm:mt-0">
  <div class="bg-white shadow-md rounded-lg">
    <div style="padding: 10px !important;">
      <h4 class="text-red-600 font-semibold text-lg mb-1">Summary</h4>

      <div class="flex items-center mb-1">
        <div class="w-5 h-5 border border-black mr-2" style="background-color: yellow;"></div>
        <span class="text-sm font-medium text-gray-700">Item details contain less than 20 characters.</span>
      </div>

      <div class="flex items-center">
        <div class="w-5 h-5 bg-red-500 border border-black mr-2"></div>
        <span class="text-sm font-medium text-gray-700">No item details exist.</span>
      </div>

    </div>
  </div>
</div>

</div>
<div class="mt-4 bg-white  shadow-sm ring-1 ring-gray-200" style="border-top-width: 0.5px;
    border-color: #cfdbe2;">
  <div style="padding: 10px !important;">
    

    <div class="overflow-x-auto" >
      <!-- <button class="btn btn-success" type="submit" [routerLink]="['/expense-add']">Add</button> -->
    <ejs-grid #mainGrid class="custom-grid"
            [dataSource]="fetchCheckWeightData"
            [allowSorting]="true"
            [allowPaging]="true"
            [allowFiltering]="true"
            [allowExcelExport]="true"
            [toolbar]="['Search']"
            [pageSettings]="{ pageSize: 30, pageSizes: [25,50,100,150] }"
            [filterSettings]="filterSettings"
            [enableHover]="true" (rowDataBound)="onRowDataBound($event)"
            [allowResizing]="true"
            [allowTextWrap]="true"
            (toolbarClick)="ToogledToolBar($event)"
            [enableVirtualization]="false">
    
    <e-columns>

                      <e-column type="checkbox" width="50"></e-column>
      <e-column field="manifest_number" headerText="Maifest No."></e-column>

<e-column field="hawb_no" width="120" headerText="HAWB No">

</e-column>

      <e-column field="item_type" headerText="Item Type"></e-column>

      <e-column field="width" headerText="Width (cm)"></e-column>
