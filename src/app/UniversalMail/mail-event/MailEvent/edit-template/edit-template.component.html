<div class="flex items-center justify-between mb-3">
  <!-- Breadcrumbs -->
  <ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark">
      <li>
          <a href="javascript:;"
              class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
              <icon-home />
          </a>
      </li>
      <li
    class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full before:bg-primary">
    <a routerLink="/universal/Event"
      class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
      <icon-box class="shrink-0 ltr:mr-2 rtl:ml-2" />
      Event
    </a>
  </li>
        <li
    class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full before:bg-primary">
    <button
      class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
      <icon-cpu-bolt class="ltr:mr-2 rtl:ml-2" />
      Event Details
      <!-- <icon-caret-down class="inline-block ltr:ml-1 rtl:mr-1" /> -->
    </button>

    <!-- <mat-menu #menu="matMenu">
      <button mat-menu-item> New Bookings</button>
      <button mat-menu-item> Pickup Arranged Shipments</button>
      <button mat-menu-item> Cancelled Bookings</button>
    </mat-menu> -->
  </li>
  </ol>

  <!-- Back Button -->
  <button routerLink="/universal/Event"
      class="flex items-center gap-2 rounded-md bg-gray-200 px-4 py-2 text-gray-700 hover:bg-gray-300 dark:bg-[#191e3a] dark:text-white-dark dark:hover:bg-[#222946]">
      <i class="fas fa-arrow-left"></i> Back
  </button>
</div>



<div class="grid grid-cols-4 gap-4">
  <!-- Left Panel -->
  <div class="col-span-1 p-4 bg-gray-100 rounded-lg shadow">
    <div class="flex flex-col space-y-3 mb-4">
      <label class="inline-flex items-center">
        <input type="radio" name="mailOption" value="true" (change)="v1_m_mail_events_update()" [(ngModel)]="mailOption"
               class="form-radio text-blue-600">
        <span class="ml-2">Send Mail</span>
      </label>
      <label class="inline-flex items-center">
        <input type="radio" name="mailOption" value="false" (change)="v1_m_mail_events_update()" [(ngModel)]="mailOption"
               class="form-radio text-red-600">
        <span class="ml-2">Mute Mail</span>
      </label>
    </div>

    <div class="border-t pt-3">
      <h3 class="text-gray-700 font-semibold text-lg">{{ eventName }}</h3>
      <p class="text-sm text-gray-500">{{ eventDetails }}</p>
    </div>
    <div class="border-t pt-3">
      <h3 class="text-gray-700 font-semibold text-lg">Tags</h3>
      <p class="text-sm text-gray-500">Hawb No:- [hawb_no]</p>
            <p *ngIf="recId == '1' || recId == '3' " class="text-sm text-gray-500">Box No:- [box_no]</p>

            <p class="text-sm text-gray-500">Sender Name:- [sender_name]</p>
      <p class="text-sm text-gray-500">Receiver Name:- [receiver_name]</p>

    </div>
  </div>

  <!-- Right Panel -->
  <div class="col-span-3 p-4 bg-white rounded-lg shadow">
    <!-- Subject -->
    <div class="mb-4">
      <label class="block text-gray-700 font-medium mb-2">Subject</label>
      <input type="text" [(ngModel)]="subject" placeholder="Enter subject"
             class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring focus:ring-blue-200">
    </div>

    <!-- Body -->
    <div>
      <label class="block text-gray-700 font-medium mb-2">Body</label>
      <quill-editor [modules]="editorOptions" [(ngModel)]="body" class="w-full" [style]="{height: '200px'}"></quill-editor>
    </div>

    <!-- Optional Send Button -->
    <div class="mt-4 text-right">
      <button (click)="sendMail()"
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Save Change
      </button>
    </div>
  </div>
</div>
