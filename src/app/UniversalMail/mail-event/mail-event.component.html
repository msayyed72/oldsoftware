<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
    <li>
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-home />
        </a>
    </li>
    <li
        class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full ">
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
            <icon-users-group class="shrink-0 ltr:mr-2 rtl:ml-2" />

            Event
        </a>
    </li>



</ol>



<ejs-grid appInputSearch [dataSource]="generatedTemplates" height="500" [allowPaging]="true" [allowSorting]="true"
    [allowFiltering]="true" [allowPaging]='true' [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }'
    [toolbar]="['Search']" [filterSettings]="{ ignoreAccent: true, hierarchyMode: 'None', type: 'Excel' }"
    [allowTextWrap]="true">
    <e-columns>
        <ng-template #serialTemplate let-data let-rowIndex="rowIndex">
            {{ +data.index + 1 }}
        </ng-template>


        <e-column field="mail_events_name" headerText="Event Name" width="150">
            <ng-template #template let-data>
                <span style="color: rgb(0, 149, 255);cursor: pointer;" (click)="EditTemplate(data)">
                    {{data.mail_events_name}}
                </span>
            </ng-template>
        </e-column>
        <e-column field="mail_events_description" headerText="Event Description" width="180"></e-column>
                <e-column field="mail_counter" headerText="Email Count" width="180"></e-column>

        <e-column field="mail_status" headerText="Body" width="130" height="10" [template]="mailSts">
            <ng-template #mailSts let-data>
                <label class="w-12 h-6 relative">
<input type="checkbox" (change)="v1_m_mail_events_update(data)" [(ngModel)]="data.mail_status" class="custom_switch absolute w-full h-full opacity-0 z-10 cursor-pointer peer" id="custom_switch_checkbox2" />
    <span for="custom_switch_checkbox2" class="outline_checkbox bg-icon border-2 border-[#ebedf2] dark:border-white-dark block h-full rounded-full before:absolute before:left-1 before:bg-[#ebedf2] dark:before:bg-white-dark before:bottom-1 before:w-4 before:h-4 before:rounded-full before:bg-[url(/assets/images/close.svg)] before:bg-no-repeat before:bg-center peer-checked:before:left-7 peer-checked:before:bg-[url(/assets/images/checked.svg)] peer-checked:border-primary peer-checked:before:bg-primary before:transition-all before:duration-300"></span>
</label>
            </ng-template>
        </e-column>


        <e-column headerText="Action" width="150" [template]="actionForIncomplete"></e-column>
        <ng-template #actionForIncomplete let-data>
            <!-- Call Verification -->
            <button mat-icon-button [matMenuTriggerFor]="actionMenu">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 512 512">
                    <path
                        d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8 2.8 18.6 .3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z" />
                </svg>
            </button>
            <mat-menu #actionMenu="matMenu" (click)="EditTemplate(data)">

                <button mat-menu-item>
                    <span class="menu-item">
                        Edit Template
                    </span>
                </button>
                <button mat-menu-item>
                    <span class="menu-item">
                        Delete Template

                    </span>
                </button>
            </mat-menu>

        </ng-template>

    </e-columns>
</ejs-grid>
