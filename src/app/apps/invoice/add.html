                    </div>
                </div>

                                <th class="py-2 px-4 text-right">Price</th>

                            <tr>

                                </td>
                                <td class="py-2 px-4 text-right" colspan="3"></td>
                            </tr>

                    </table>
    <div class="w-full md:w-1/2">

                    <div class="w-full md:w-1/2">

                                <span class="font-semibold">Subtotal</span>
                                <span>$265.00</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="font-semibold">Tax(%)</span>

                    <button type="button" class="btn btn-info w-full gap-2">
                        <icon-refresh class="shrink-0 ltr:mr-2 rtl:ml-2" />

                    </button>
                    <button class="btn btn-primary w-full gap-2">
                        <icon-logout class="shrink-0 ltr:mr-2 rtl:ml-2" />

                    </button>
                    <button type="button" class="btn btn-secondary w-full gap-2">
                        <icon-download class="shrink-0 ltr:mr-2 rtl:ml-2" />
