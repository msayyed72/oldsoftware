<div class="container-fluid">
    <form [formGroup]="valForm">
        <div class="row mt-1">
            <div class="col  mx-1 columnBorder custom-container">
                <div class="custom-content">
                    <div class="table-responsive mt-3" id="overflow">
                        <table class="table">
                            <thead style="top: 0;position: sticky" class="tableBackgroundColor">
                                <tr class="tableBackgroundColor bg-primary">
                                    <th class="th2 w-1">S.NO</th>
                                    <th class="th2 w-1">Ctn no</th>
                                    <th class="th2 w-5">Item Name</th>
                                    <th class="th2 w-1">Qty</th>
                                    <th class="th2 w-1">Unit</th>
                                    <th class="th2 w-1">val Amt</th>
                                    <th class="th2 w-1">Action</th>
                                </tr>
                                <tr>
                                    <td style="width: 3.5%;color:darkgreen;font-weight: bold;padding: 0px;">
                                    </td>
                                    <td style="width: 5.5%;color:darkgreen;font-weight: bold;padding: 10px;">
                                        <input #F_CTNF 
                                            style="border: 1px solid steelblue;width: 100%;border-radius: 5px;text-align: center;font-size: medium;color: black;height: 25px"
                                            type="text" formControlName="carton_no" maxlength="5"
                                            (keyup.enter)="ctnfocus();setcartno(valForm.value)" (change)="setcartno(valForm.value)"
                                            oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\..*)\./g, '$1');" />
                                    </td>
                                    <td style="width: 31%;color:darkgreen;font-weight: bold;padding: 10px;">
                                        <input (keyup.enter)="quafocus()" #F_ITN
                                            style="border: 1px solid steelblue;width: 100%;border-radius: 5px;text-align: center;font-size: medium;color: black;height: 25px"
                                            type="text" maxlength="50" 
                                            formControlName="item_description" />
                                    </td>
                                    <td style="width: 6%;color:darkgreen;font-weight: bold;padding: 10px;">
                                        <input #F_QUA
                                            (keyup.enter)="savfocus();valuecal(valForm.value)" (change)="valuecal(valForm.value)"
                                            style="border: 1px solid steelblue;width: 100%;border-radius: 5px;text-align: center;font-size: medium;height: 25px"
                                            formControlName="quantity" type="text" placeholder="Qty" maxlength="6"
                                            oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\..*)\./g, '$1');" />
                                    </td>
                                    <td style="width: 6%;color:darkgreen;font-weight: bold;padding: 10px;">
                                        <input #F_GOV (keyup.enter)="vapfocus()"
                                            (change)="valuecal(valForm.value)" (keyup.enter)="valuecal(valForm.value)"
                                            style="border: 1px solid steelblue;width: 100%;border-radius: 5px;text-align: center;font-size: medium;height: 25px"
                                            formControlName="unit_price" type="text" placeholder="Value" maxlength="11"
                                            oninput="this.value = this.value.replace(/[^0-9/.]/g, '').replace(/(\..*)\./g, '$1');" />
                                    </td>

                                    <td style="width: 6%;color:darkgreen;font-weight: bold;padding: 10px;">
                                        <input
                                            style="border: 1px solid steelblue;width: 100%;border-radius: 5px;text-align: center;font-size: medium;height: 25px"
                                            type="text" placeholder="Val Amt" maxlength="11" #F_SAV (keyup.enter)="itnfocus()"
                                            formControlName="value_amount" (keyup.enter)="save()"
                                            oninput="this.value = this.value.replace(/[^0-9/.]/g, '').replace(/(\..*)\./g, '$1');" />
                                    </td>
                                    <td style="width: 6%;color:darkgreen;font-weight: bold;padding: 10px;">
                                        <button class="btn btn-info btn-sm" type="button" (click)="save()">SAVE</button>
                                    </td>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="item_table_tr" *ngFor="let list of ItemArray, let i=index">
                                    <td>{{i+1}}</td>
                                    <td>{{list.carton_no}}</td>
                                    <td>{{list.item_description}}</td>
                                    <td>{{list.quantity}}</td>
                                    <td>{{list.unit_price}}</td>
                                    <td>{{list.value_amount}}</td>
                                    <td class="d-flex justify-content-center align-items-center">
                                        <button>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="red"
                                                class="bi bi-trash-fill" viewBox="0 0 16 16">
                                                <path
                                                    d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                                            </svg>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="row mt-2 mx-1">
                        <div class="col-auto col-xl-8 col-lg-9 col-md-12 text-lg-sm">
                            <span for="" class="labelStyle text-center">Total
                                Item:</span>&nbsp;&nbsp;<span
                                class=" badgeStyleThree bg-danger text-white   px-2 ">{{tot_item}}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                            <span for="" class="labelStyle">Total Quantity:</span>&nbsp;&nbsp;<span
                                class=" badgeStyleThree bg-danger text-white   px-2">{{tot_qty}}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;


                            <span for="" class="labelStyle">Total Carton:</span>&nbsp;&nbsp;<span
                                class=" badgeStyleThree bg-danger text-white   px-2">{{tot_ctn}}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                            <span for="" class="labelStyle">Total Value:</span>&nbsp;&nbsp;<span
                                class=" badgeStyleThree bg-danger text-white   px-2">{{inv_value}}</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

                        </div>
                        <div class="flex justify-end">
                            <button class="btn btn-success btn-sm">Save Packing List</button>
                        </div>
                    </div>
                </div>
                <div class="border-content ManualDetailsHeight"><button class="butDesign bg-primary">Packing
                        List</button></div>
            </div>
        </div>
    </form>
</div>
