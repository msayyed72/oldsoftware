    <div class="panel mt-6 pb-1.5">
        <div class="mb-4.5 flex flex-col justify-between gap-5 md:flex-row md:items-center">
            <div class="flex flex-wrap items-center">
                <button type="button" class="btn btn-primary btn-sm m-1" (click)="router.navigate(['/apps/invoice/add'])">
                    <icon-file class="h-5 w-5 ltr:mr-2 rtl:ml-2" />
                    CREATE NEW INVOICE
                </button>
                <!-- <button type="button" class="btn btn-primary btn-sm m-1" (click)="exportTable('txt')">

                    TXT
                </button> -->
                <div class="relative m-1">
                    <input type="date" [(ngModel)]="date" (change)="get_invoice()">
                </div>
                <!-- <button type="button" class="btn btn-primary btn-sm m-1" (click)="exportTable('print')">
                    <icon-printer class="ltr:mr-2 rtl:ml-2" />
                    PRINT
                </button> -->
            </div>

            <div class="text-right">
                <input [(ngModel)]="search" type="text" class="form-input w-auto" placeholder="Search..." />
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>HAWB Date</th>
                        <th>Invoice No</th>
                        <th>Ref No</th>
                        <th>State</th>
                        <th>Sender Name</th>
                        <th>Total Carton</th>
                        <th>Weight</th>
                        <th>Print Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let list of rowsFilter;let i=index" 
                        (dblclick)="view_invoice(list.hawb_no,list.hawb_id,list.printing_status)">
                        <td>{{i+1}}</td>
                        <td class="whitespace-nowrap">{{list.hawb_date}}</td>
                        <td>{{list.hawb_no}}</td>
                        <td>{{list.reference_no}}</td>
                        <td>{{list.state_name}}</td>
                        <td>{{list.sender_name}}</td>
                        <td>{{list.total_carton}}</td>
                        <td>{{list.total_weight}}</td>
                        <td>{{list.printing_status}}</td>
                        <td class="border-b border-[#ebedf2] p-3 text-center dark:border-[#191e3a]">
                            <div class="flex items-center">
                                <div class="mr-3">
                                    <button type="button" ngxTippy data-tippy-content="Edit">
                                        <icon-edit></icon-edit>
                                    </button>
                                </div>
                                <div>
                                    <button type="button" (click)="get_awb_print(list.hawb_no)" ngxTippy data-tippy-content="Download">
                                        <icon-download></icon-download>
                                    </button>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
