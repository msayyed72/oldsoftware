<div>
    <div class="absolute inset-0">
        <img src="assets/images/auth/bg-gradient.png" alt="image" class="h-full w-full object-cover" />
    </div>

    <div
        class="relative flex min-h-screen items-center justify-center bg-[url(/assets/images/auth/map.png)] bg-cover bg-center bg-no-repeat px-6 py-10 dark:bg-[#006F3B] sm:px-16"
    >
        <img src="assets/images/auth/coming-soon-object1.png" alt="image" class="absolute left-0 top-1/2 h-full max-h-[893px] -translate-y-1/2" />
        <img src="assets/images/auth/coming-soon-object2.png" alt="image" class="absolute left-24 top-0 h-40 md:left-[30%]" />
        <img src="assets/images/auth/coming-soon-object3.png" alt="image" class="absolute right-0 top-0 h-[300px]" />
        <img src="assets/images/auth/polygon-object.svg" alt="image" class="absolute bottom-0 end-[28%]" />
        <div
            class="relative w-full max-w-[570px] rounded-md bg-[linear-gradient(45deg,#fff9f9_0%,rgba(255,255,255,0)_25%,rgba(255,255,255,0)_75%,_#fff9f9_100%)] p-2 dark:bg-[linear-gradient(52.22deg,#0E1726_0%,rgba(14,23,38,0)_18.66%,rgba(14,23,38,0)_51.04%,rgba(14,23,38,0)_80.07%,#0E1726_100%)]"
        >
            <div class="relative flex flex-col justify-center rounded-md bg-white/60 px-6 py-10 backdrop-blur-lg dark:bg-black/50 lg:min-h-[158px]">
                <img src="assets/images/cf_logo.png" width="60%" class="min-h-[100px]" style="align-self: center;">
                <div class="mx-auto w-full max-w-[340px]  mt-3">
                    <div class="mb-5">
                        
                    </div>
                    <form class="space-y-5 dark:text-white" [formGroup]="valForm">
                        <div>
                            <label for="name">User Name</label>
                            <div class="relative text-white-dark">
                                <input id="name" type="text" placeholder="Enter User Name" 
                                #F_USR  (keyup.enter)="pwdfocus();F_PWD.select()" (click)="F_USR.select()"
                                autocomplete="off" 
                                formControlName="email"
                                class="form-input ps-10 placeholder:text-white-dark" />
                                <span class="absolute start-4 top-1/2 -translate-y-1/2">
                                    <icon-mail [fill]="true" />
                                </span>
                            </div>
                        </div>
                        <div>
                            <label for="Password">Password</label>
                            <div class="relative text-white-dark">
                                <input id="Password" type="password" placeholder="Enter Password" 
                                #F_PWD (keyup.enter)="submitForm(valForm.value)"
                                formControlName="password"
                                class="form-input ps-10 placeholder:text-white-dark" />
                                <span class="absolute start-4 top-1/2 -translate-y-1/2">
                                    <icon-lock-dots [fill]="true" />
                                </span>
                            </div>
                        </div>
                        <button type="button" (click)="submitForm(valForm.value)" [disabled]="!valForm.valid"
                            class="btn btn-gradient !mt-6 w-full border-0 uppercase shadow-[0_10px_20px_-10px_rgba(67,97,238,0.44)]">
                           <span *ngIf="!btn3">Log in</span><span *ngIf="btn3">Loging.....</span><i class="fa fa-spinner fa-spin" aria-hidden="true" *ngIf="btn3"></i>
                        </button>
                    </form>
                </div>
                <div class="relative my-7 text-center md:mb-9">
                    <span class="absolute inset-x-0 top-1/2 h-px w-full -translate-y-1/2 bg-white-light dark:bg-white-dark"></span>
                </div>
                <!-- <p class="text-center">Developed By FemtoSoft Technologies</p> -->
            </div>
        </div>
    </div>
</div>
