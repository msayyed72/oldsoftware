<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
    <li>
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
            <icon-home />
        </a>
    </li>
   
    <li
        class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full before:bg-primary">
        <a href="javascript:;"
            class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
            <icon-box class="shrink-0 ltr:mr-2 rtl:ml-2" />
            Final Invoice
        </a>
    </li>
     <li class="ml-auto flex items-center justify-center text-gray-500 dark:text-white-dark">
        <!-- You can replace this with dynamic date if necessary -->
        <input type="date" class="form-input" [(ngModel)]="date" (change)="get_invoice()" >
    </li>

   
</ol>





<ejs-grid appInputSearch (recordDoubleClick)="dblEventDetected($event)" #mainGrid height="80vh" 
  [dataSource]="rowsFilter" [allowSorting]="true" [allowReordering]="true" [allowSorting]='true' 
  (rowSelected)="assignRowDate($event.data)" [allowExcelExport]="true" [allowTextWrap]='true' 
  [showColumnChooser]="true" [allowPdfExport]="true" [allowFiltering]='true' 
  (toolbarClick)="ToogledToolBar($event)" [filterSettings]='filterSettings' (actionBegin)="onActionBegin($event)" 
  [toolbar]="toolbarOptions" toolbarOverflowMode="Scrollable" [allowPaging]='true' [allowResizing]="true"
  [pageSettings]='{ pageSize: 50, pageSizes: [25,50,100,150] }' (rowDataBound)="highlightBookingAgent($event)"
  style="width: 100%;">

  <e-columns>
    <!-- Serial Number -->
    <e-column field='hawb_no' headerText='HAWB'  width='100' [allowSorting]='true' [allowFiltering]='true' filterType='Input'>
        <ng-template #template let-data>
            <a  class="text-primary cursor-pointer" (click)="navigateShipment(data)">{{data.hawb_no}}</a>
        </ng-template>
    </e-column>
    <e-column field='hawb_date' headerText='Date' width='120' format='dd/MM/yyyy' [allowFiltering]='true' filterType='Date'></e-column>
    <e-column field="co_loader" headerText="Collection By." width="160" textAlign="Left"></e-column>
    <e-column field="sales_rep" headerText="Sales Rep." width="160" textAlign="Left"></e-column>
    <e-column field='sender_name' headerText='Sender Details' width='180' [allowFiltering]='true'>
  <ng-template #template let-data>
    <div>
      <div>{{ data.sender_name }}</div>
      <div>{{ data.sender_mail }}</div>
      <div>{{ data.sender_mobile }}</div>
    </div>
  </ng-template>
</e-column>

    <!-- <e-column field='sender_name' headerText='Sender Name' width='180' [allowFiltering]='true'></e-column>
    <e-column field='sender_mobile' headerText='Sender Phone' width='180' [allowFiltering]='true'></e-column>
    <e-column field='sender_mail' headerText='Email' width='180' textAlign='Left' [allowFiltering]='true'></e-column> -->
    <e-column field='deposit_payment_amt' headerText='Deposit Amt' width='150' textAlign='Right' [allowFiltering]='true' filterType='Number'></e-column>
    <e-column field='payable_amount' headerText='Final Amt' width='150' textAlign='Right' [allowFiltering]='true' filterType='Number'></e-column>
    <e-column field='pendingCount' headerText='Not Rec.' width='150' textAlign='Right' [allowFiltering]='true' filterType='Number'></e-column>

    <!-- Invoice Status -->
    <e-column field="invCurrentSts" headerText="Invoice Status" width='150' textAlign="Center">
      <ng-template #template let-data>
        <span [ngClass]="getIconClass(data.invCurrentSts)" class="flex justify-center items-center">
          <ng-container *ngIf="data.invCurrentSts === 'Not Generated'">
            <span [ngxTippy]="'Not Generated'">
              <icon-x class="h-6 w-6" />
            </span>
          </ng-container>
          <ng-container *ngIf="data.invCurrentSts === 'Generated'">
            <span [ngxTippy]="'Invoice Generated'">
              <icon-file class="h-6 w-6" />
            </span>
          </ng-container>
          <ng-container *ngIf="data.invCurrentSts === 'Marked as Sent'">
            <span [ngxTippy]="'Marked as Sent'">
              <icon-checks class="h-6 w-6" />
            </span>
          </ng-container>
          <ng-container *ngIf="data.invCurrentSts === 'Sent to Customer'">
            <span [ngxTippy]="'Sent to Customer'">
              <icon-mail class="h-6 w-6" />
            </span>
          </ng-container>
        </span>
      </ng-template>
    </e-column>
     <e-column field="payment_status" headerText="Payment Status" textAlign="Center"
          [template]="PaymentStsforinv"></e-column>
           <ng-template #PaymentStsforinv let-item>
  <span [ngClass]="{
    'text-success': item.payment_status === 'yes', 
    'text-danger': item.payment_status === 'no', 
    'text-info': item.payment_status === 'npd'
  }" 
  [ngxTippy]="
    item.payment_status === 'yes' ? 'Paid' : 
    item.payment_status === 'no' ? 'Not Paid' : 'NP - D'
  ">
    <icon-credit-card class="h-5 w-5"></icon-credit-card>
  </span>
  
    </ng-template>

  </e-columns>

  <ng-template #noRecords>
    <div class='emptyRecordTemplate'>
      <span>There is no data available to display at the moment.</span>
    </div>
  </ng-template>
</ejs-grid>

<ng-template #serialTemplate let-data let-rowIndex="rowIndex">
  {{ +data.index + 1 }}
</ng-template>
