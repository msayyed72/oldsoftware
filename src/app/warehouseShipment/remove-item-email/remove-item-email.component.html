

<ol class="flex flex-wrap items-center gap-y-4 font-semibold text-gray-500 dark:text-white-dark mb-3">
  <li>
    <a href="javascript:;"
      class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 shadow hover:text-gray-500/70 dark:border-0 dark:bg-[#191e3a] dark:hover:text-white-dark/70">
      <icon-home />
    </a>
  </li>

  <li
    class="flex items-center before:relative before:-top-0.5 before:mx-4 before:inline-block before:h-1 before:w-1 before:rounded-full before:bg-primary">
    <a href="javascript:;"
      class="flex items-center justify-center rounded-md border border-gray-500/20 p-2.5 text-primary shadow dark:border-0 dark:bg-[#191e3a]">
      <icon-box class="shrink-0 ltr:mr-2 rtl:ml-2" />
    Remove Item Mail
    </a>
  </li>
 


</ol>

<form class="mx-auto mb-5 w-full sm:w-1/2">
    <div class="relative">
        <input type="text" placeholder="Search Hawb..."
            class="form-input h-11 rounded-full bg-white shadow-[0_0_4px_2px_rgb(31_45_61_/_10%)] placeholder:tracking-wider ltr:pr-11 rtl:pl-11"
            [(ngModel)]="invoiceFilter" (input)="loadData()" name="search" />
        <button type="button"
            class="btn btn-primary absolute inset-y-0 m-auto flex h-9 w-9 items-center justify-center rounded-full p-0 ltr:right-1 rtl:left-1">
            <icon-search class="mx-auto" (click)="loadData()" />
        </button>
    </div>
</form>




<form [formGroup]="params" class="grid gap-6 p-6">


<div>
        <input type="text" class="form-input" placeholder="Sender Name" formControlName="name" />
    </div>



    <div>
        <input type="text" class="form-input" placeholder="Enter To" formControlName="to" />
    </div>


    <!-- Editor -->
    <div class="h-fit">
        <quill-editor #editor [modules]="editorOptions" placeholder="" formControlName="description" class="w-full"
            style="min-height: 200px" (onContentChanged)="quillEditorReady($event)"></quill-editor>
    </div>

     <div >
                <input id="file" type="file" (change)="handleFileSelect($event)"
                    class="form-input p-0 file:border-0 file:bg-primary/90 file:px-4 file:py-2 file:font-semibold file:text-white file:hover:bg-primary ltr:file:mr-5 rtl:file:ml-5"
                    multiple accept="image/*,application/pdf" />
            </div>
    <!-- File upload -->

    <!-- ✅ Radio Buttons for Send Type -->

    <!-- Buttons -->
    <div class="mt-8 flex items-center ltr:ml-auto rtl:mr-auto">
     
        <button type="button" class="btn btn-primary" (click)="sendEmail11()">
           Send Mail
        </button>

    </div>
    <div class="mt-8" *ngIf="uploadedFiles.length > 0">
            <div class="mb-4 text-base">Attachments</div>
            <div class="h-px border-b border-[#e0e6ed] dark:border-[#1b2e4b]"></div>

            <div class="mt-6 flex flex-wrap items-center">
                <ng-container *ngFor="let f of uploadedFiles">
                    <div
                        class="group relative mb-4 flex items-center rounded-md border border-[#e0e6ed] px-4 py-2.5 transition-all duration-300 hover:border-primary hover:text-primary ltr:mr-4 rtl:ml-4 dark:border-[#1b2e4b]">
                        <!-- Icon by mime -->
                        <ng-container *ngIf="isImage(f)">
                            <icon-gallery class="h-5 w-5" />
                        </ng-container>
                        <ng-container *ngIf="isPdf(f)">
                            <icon-zip-file class="h-5 w-5" />
                        </ng-container>
                        <ng-container *ngIf="!isImage(f) && !isPdf(f)">
                            <icon-txt-file class="h-5 w-5" />
                        </ng-container>

                        <!-- Name + Size -->
                        <div class="ltr:ml-3 rtl:mr-3">
                            <p class="text-xs font-semibold text-primary">{{ getName(f) }}</p>
                            <p class="text-[11px] text-gray-400 dark:text-gray-600">{{ getSize(f) }}</p>
                        </div>

                        <!-- Hover overlay -->
                        <div
                            class="absolute top-0 z-[5] hidden h-full w-full rounded-md bg-dark-light/40 group-hover:block ltr:left-0 rtl:right-0">
                        </div>

                        <!-- Hover actions -->
                        <div
                            class="absolute left-1/2 top-1/2 z-10 hidden -translate-x-1/2 -translate-y-1/2 space-x-2 group-hover:flex">
                            <button *ngIf="isImage(f)" class="btn btn-primary rounded-full p-1"
                                (click)="openImagePreview(f.preview)">
                                <i class="fas fa-eye"></i>
                            </button>

                            <button *ngIf="isPdf(f)" class="btn btn-primary rounded-full p-1"
                                (click)="openBlobPDF(f.preview)">
                                <i class="fas fa-file-pdf"></i>
                            </button>

                            <button class="btn btn-primary rounded-full p-1" (click)="downloadFile(f)">
                                <icon-download class="h-4.5 w-4.5"></icon-download>
                            </button>

                            <button type="button" class="btn btn-danger rounded-full p-1" (click)="removeFile(f)">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                </ng-container>
            </div>
        </div>
</form>
